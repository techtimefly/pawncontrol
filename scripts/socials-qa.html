<!doctype html><meta charset="utf-8"><title>Socials regression QA</title><style>body{font:16px system-ui;background:#ddd}button{padding:12px}iframe{border:0;display:block;margin:20px 0;background:#333}pre{white-space:pre-wrap}</style>
<button id="run">Run Socials browser checks</button><pre id="results">Ready</pre><div id="frames"></div>
<script type="module">
const out=document.querySelector('#results'),frames=document.querySelector('#frames'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,label)=>{if(!ok)throw Error(label);out.textContent+='PASS '+label+'\n';};
const request=async(path,data)=>{const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error);return b;};
const action=a=>request('/api/action',a),state=()=>request('/api/state');
const wait=async(fn)=>{for(let i=0;i<100;i++){if(fn())return;await sleep(50);}throw Error('Timed out');};
async function make(path,w,h){const f=document.createElement('iframe');f.width=w;f.height=h;frames.append(f);await new Promise(r=>{f.onload=r;f.src=path;});await wait(()=>f.contentDocument.querySelector('.stats-card'));check(f.contentWindow.innerWidth===w&&f.contentWindow.innerHeight===h,`${path} actual viewport ${w}x${h}`);return f;}
const click=(d,id)=>d.getElementById(id).click();
function fill(input,value){input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));}
const field=(d,label)=>[...d.querySelectorAll('#socials-editor label')].find(e=>e.firstChild.textContent===label)?.querySelector('input,select');
async function file(d,bytes,name){const input=d.querySelector('#socials-editor input[type=file]'),dt=new DataTransfer();dt.items.add(new File([bytes],name,{type:'image/png'}));input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));await wait(()=>!d.querySelector('#socials-editor').disabled);}
document.querySelector('#run').onclick=async()=>{
  out.textContent='';frames.replaceChildren();
  try{
    const s=await state(),platforms=['twitch','youtube','discord','instagram','tiktok','x','bluesky','website'];
    const socials={...s.socials,mode:'rotate',interval:5,items:platforms.map((platform,i)=>({id:'qa-'+i,platform,text:'@chess_fixture',cta:'Follow for more chess',icon:null,enabled:true}))};
    await action({type:'socials-playback',command:'play'});await action({type:'socials-edit',expected:s.socials,socials});await action({type:'settings',settings:{widgets:{...s.widgets,socials:{...s.widgets.socials,visible:true}}}});
    const full=await make('/control',1920,1080),d=full.contentDocument;d.querySelector('[data-tab=socials]').click();await wait(()=>field(d,'Handle, display text or short URL'));
    fill(field(d,'Handle, display text or short URL'),'<img src=x onerror=alert(1)>');await action({type:'record',result:'win'});await sleep(150);check(field(d,'Handle, display text or short URL').value==='<img src=x onerror=alert(1)>','draft survives unrelated SSE');
    d.querySelector('[data-tab=session]').click();d.querySelector('[data-tab=socials]').click();check(field(d,'Handle, display text or short URL').value.includes('<img'),'draft survives tab navigation');
    await file(d,'<svg onload=alert(1)>','bad.png');check(d.querySelector('#socials-status').textContent.includes('Upload failed'),'failed upload reports error');check(field(d,'Handle, display text or short URL').value.includes('<img'),'failed upload retains draft');
    const canvas=document.createElement('canvas');canvas.width=32;canvas.height=32;const ctx=canvas.getContext('2d');ctx.fillStyle='#27baf3';ctx.fillRect(0,0,32,32);ctx.fillStyle='#142030';ctx.fillRect(8,8,16,16);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    await file(d,blob,'custom.png');check(d.querySelector('#socials-status').textContent.includes('Icon uploaded'),'valid PNG upload');click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');check((await state()).socials.items[0].platforms[0].icon,'custom icon saved');check(!d.querySelector('#socials-preview .social-copy img'),'HTML-like handle is plain text');
    await file(d,blob,'replacement.png');click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');const localButton=text=>[...d.querySelectorAll('#socials-editor button')].find(b=>b.textContent===text);
    localButton('Use platform icon').click();localButton('Move down').click();localButton('Move down').click();click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');check((await state()).socials.items[0].platforms[0].icon===null,'remove custom assignment and repeated reorder saves');
    localButton('+ Add social').click();[...d.querySelectorAll('#socials-editor button')].filter(b=>b.textContent==='Remove callout').at(-1).click();await wait(()=>d.querySelector('#modal').open);d.querySelector('#modal-form button[type=submit]').click();await wait(()=>!d.querySelector('#socials-editor').disabled);click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');check((await state()).socials.items.length===8,'add and remove draft entry');
    fill(field(d,'Handle, display text or short URL'),'retained conflict draft');let current=await state();await action({type:'socials-edit',expected:current.socials,socials:{...current.socials,font:current.socials.font===34?36:34}});click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent.includes('Save failed'));check(field(d,'Handle, display text or short URL').value==='retained conflict draft','concurrent edit rejected with draft retained');click(d,'socials-reload');check(field(d,'Handle, display text or short URL').value.includes('<img'),'explicit reload recovers saved input');
    fill(field(d,'Handle, display text or short URL'),'@chess_fixture');click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');click(d,'socials-pause');await wait(()=>d.querySelector('#socials-pause').textContent==='Resume');click(d,'socials-next');await sleep(100);const next=d.querySelector('#socials-preview').dataset.socialId;click(d,'socials-previous');await sleep(100);check(next!==d.querySelector('#socials-preview').dataset.socialId,'next / previous while paused');
    const confirm=async()=>{await wait(()=>d.querySelector('#modal').open);d.querySelector('#modal-form button[type=submit]').click();await wait(()=>!d.querySelector('#socials-editor').disabled);};
    localButton('Group matching handles').click();await wait(()=>d.querySelector('#modal').open);check(d.querySelector('#modal-content').textContent.includes('8 callouts'),'group preview describes before and after');click(d,'modal-cancel');await wait(()=>!d.querySelector('#socials-editor').disabled);check(d.querySelectorAll('.bonus-editor-card').length===8,'cancel retains separate callouts');
    localButton('Group matching handles').click();await confirm();check(d.querySelectorAll('#socials-editor .bonus-editor-card').length===1,'confirmed group drafts one callout');check(d.querySelectorAll('#socials-editor .social-platform').length===8,'all platform controls retained');click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');check((await state()).socials.items.length===1,'group saves as one callout');
    localButton('Undo last group / split / removal').click();check(d.querySelectorAll('#socials-editor .bonus-editor-card').length===8,'undo after save recovers entries');click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');
    localButton('Group matching handles').click();await confirm();localButton('Icon right').click();check(localButton('Undo last group / split / removal').disabled,'later edit invalidates undo');click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');
    const order=(await state()).socials.items[0].platforms.map(p=>p.platform);check(order[0]==='youtube','icon reorder persists');
    localButton('Split to callout').click();await confirm();check(d.querySelectorAll('#socials-editor .bonus-editor-card').length===2,'split drafts separate callout');localButton('Undo last group / split / removal').click();check(d.querySelectorAll('#socials-editor .bonus-editor-card').length===1,'undo split recovers group');
    localButton('Remove icon').click();await confirm();check(d.querySelectorAll('#socials-editor .social-platform').length===7,'remove platform');localButton('Undo last group / split / removal').click();check(d.querySelectorAll('#socials-editor .social-platform').length===8,'undo platform removal');
    field(d,'Show icon').checked=false;field(d,'Show icon').dispatchEvent(new Event('input',{bubbles:true}));click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');check(d.querySelectorAll('#socials-preview img').length===7,'hidden platform excluded');field(d,'Show icon').checked=true;field(d,'Show icon').dispatchEvent(new Event('input',{bubbles:true}));click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');
    localButton('+ Add social').click();fill([...d.querySelectorAll('#socials-editor input[maxlength="120"]')].at(-1),'@other_fixture');click(d,'socials-save');await wait(()=>d.querySelector('#socials-status').textContent==='Socials saved.');
    for(const width of [380,320]){const f=await make('/dock',width,900),doc=f.contentDocument;click(doc,'dock-socials-tab');await wait(()=>doc.querySelector('#socials-preview .social-entry'));check(doc.documentElement.scrollWidth<=width,`dock ${width} no horizontal overflow`);check(doc.querySelector('#socials-editor').getBoundingClientRect().width<=width,`dock ${width} editor fits`);f.remove();}
    for(const width of [380,320]){const f=await make('/control',width,900),doc=f.contentDocument;doc.querySelector('[data-tab=socials]').click();await wait(()=>doc.querySelector('#socials-editor input'));check(doc.documentElement.scrollWidth<=width,`full panel ${width} no horizontal overflow`);f.remove();}
    const overlay=await make('/overlay',1920,1080),od=overlay.contentDocument,root=od.querySelector('.socials-root'),content=root.firstChild;
    click(d,'socials-pause');await sleep(100);const first=root.dataset.socialId;for(let i=0;i<7;i++){await action({type:'record',result:'draw'});await sleep(800);}check(root.firstChild===content,'SSE retains renderer DOM');check(root.dataset.socialId!==first,'rotation advances during repeated SSE');click(d,'socials-pause');await sleep(100);const held=root.dataset.socialId;await sleep(5200);check(root.dataset.socialId===held,'pause holds through interval');click(d,'socials-pause');await sleep(5200);check(root.dataset.socialId!==held,'resume advances');
    current=await state();await action({type:'socials-edit',expected:current.socials,socials:{...current.socials,mode:'row',items:current.socials.items.map(e=>({...e,platforms:e.platforms.map(p=>({...p,icon:null}))}))}});await action({type:'settings',settings:{widgets:{...current.widgets,socials:{...current.widgets.socials,w:2200,h:220}}}});await sleep(150);await wait(()=>[...root.querySelectorAll('img')].every(i=>i.complete&&i.naturalWidth));check(root.querySelectorAll('img').length===9,'group icons and separate callout decode');check(root.querySelectorAll('.social-handle').length===2,'shared handle renders once per callout');check([...root.querySelector('.social-entry').querySelectorAll('img')].map(i=>i.alt).join(',')==='YouTube,Twitch,Discord,Instagram,TikTok,X,Bluesky,Website','rendered icon order matches saved group');const box=root.getBoundingClientRect();check([...root.querySelectorAll('.social-entry')].every(e=>{const r=e.getBoundingClientRect();return r.right<=box.right+.5&&r.bottom<=box.bottom+.5;}),'static row no clipping at 1080p');
    overlay.width=2560;overlay.height=1440;await sleep(150);check(overlay.contentWindow.innerWidth===2560&&overlay.contentWindow.innerHeight===1440,'overlay actual native 2560x1440');
    current=await state();await action({type:'socials-edit',expected:current.socials,socials:{...current.socials,items:current.socials.items.map(e=>({...e,enabled:false}))}});await sleep(100);check(getComputedStyle(root).visibility==='hidden','all disabled hides output');await action({type:'socials-edit',expected:(await state()).socials,socials:current.socials});
    current=await state();const stress={...current.socials,items:[{...current.socials.items[0],text:('@'+'long_handle_'.repeat(10)).slice(0,120),platforms:Array.from({length:20},(_,i)=>({...current.socials.items[0].platforms[i%8],id:'stress-'+i}))}]};await action({type:'socials-edit',expected:current.socials,socials:stress});await sleep(150);check(root.querySelectorAll('img').length===20,'twenty-icon group renders');check(root.querySelectorAll('.social-handle').length===1,'long handle renders once');const stressBox=root.getBoundingClientRect();check([...root.querySelectorAll('img,.social-handle')].every(e=>{const r=e.getBoundingClientRect();return r.right<=stressBox.right+1&&r.bottom<=stressBox.bottom+1;}),'long handle and many icons contained');
    await action({type:'socials-edit',expected:stress,socials:{...stress,items:stress.items.map(e=>({...e,platforms:e.platforms.map(p=>({...p,enabled:false}))}))}});await sleep(100);check(getComputedStyle(root).visibility==='hidden','all-hidden platforms hide group');await action({type:'socials-edit',expected:(await state()).socials,socials:{...stress,items:[]}});await sleep(100);check(getComputedStyle(root).visibility==='hidden','empty list hides output');await action({type:'socials-edit',expected:(await state()).socials,socials:{...current.socials,items:[{...current.socials.items[0],platforms:current.socials.items[0].platforms.slice(0,3)}]}});
    out.textContent+='ALL SOCIALS BROWSER CHECKS PASSED\n';
  }catch(e){out.textContent+='FAIL '+e.stack;}
};
</script>
